services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coastal_watch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coastal_watch"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/docker-dev-entrypoint.sh"]
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN must be set}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/coastal_watch
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN must be set}
    ports:
      - "3000:3000"

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/coastal_watch
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      SEARCH_MODEL_NAME: ${SEARCH_MODEL_NAME:-gpt-5.4}
      EXTRACTION_MODEL_NAME: ${EXTRACTION_MODEL_NAME:-gpt-5.4-mini}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-20}
    command: ["python", "-m", "worker.cli", "run-once", "--limit", "10"]

volumes:
  postgres-data:
